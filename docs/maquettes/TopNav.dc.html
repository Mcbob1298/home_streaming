<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(15,17,23,0.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(249,249,249,0.06);z-index:20;box-sizing:border-box;font-family:Figtree,Helvetica,sans-serif">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0063E5,#0E47D1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#F9F9F9">T</div>
    <div style="font-size:14px;font-weight:600;color:#F9F9F9">Thomas</div>
  </div>
  <div style="display:flex;align-items:center;gap:34px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:{{ it.color }}">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.95">
            <sc-if value="{{ it.home }}" hint-placeholder-val="{{ false }}"><path d="M3 9.2 10 3.8l7 5.4V16a1 1 0 0 1-1 1h-3.5v-4.6h-5V17H4a1 1 0 0 1-1-1z"></path></sc-if>
            <sc-if value="{{ it.film }}" hint-placeholder-val="{{ false }}"><rect x="2.8" y="4.6" width="14.4" height="10.8" rx="1.4"></rect><path d="M6.6 4.6v10.8M13.4 4.6v10.8"></path></sc-if>
            <sc-if value="{{ it.tv }}" hint-placeholder-val="{{ false }}"><rect x="2.8" y="4.2" width="14.4" height="9.6" rx="1.4"></rect><path d="M7 16.8h6"></path></sc-if>
            <sc-if value="{{ it.grid }}" hint-placeholder-val="{{ false }}"><rect x="3" y="3" width="6" height="6" rx="1.2"></rect><rect x="11" y="3" width="6" height="6" rx="1.2"></rect><rect x="3" y="11" width="6" height="6" rx="1.2"></rect><rect x="11" y="11" width="6" height="6" rx="1.2"></rect></sc-if>
          </svg>
          <span>{{ it.label }}</span>
        </div>
        <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}">
          <div style="width:100%;height:2px;border-radius:2px;background:#F9F9F9"></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;gap:18px;color:#F9F9F9">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.4"></circle><path d="M13.2 13.2 17 17"></path></svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:68},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Accueil&quot;,&quot;Films&quot;,&quot;Séries&quot;,&quot;Genres&quot;],&quot;default&quot;:&quot;Accueil&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "Accueil";
    const defs = [
      { label: "Accueil", home: true },
      { label: "Films", film: true },
      { label: "Séries", tv: true },
      { label: "Genres", grid: true },
    ];
    return {
      items: defs.map(d => ({
        ...d,
        on: d.label === active,
        color: d.label === active ? "#F9F9F9" : "#A0A5B0",
      })),
    };
  }
}
</script>
</body>
</html>
